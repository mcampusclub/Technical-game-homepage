<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft Campus Club — Technical Game Hub</title>
<meta name="description" content="Enter the arena. Five technical logic & arcade games. One central hub. Microsoft Campus Club's Technical Game Hub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     MCC TECHNICAL GAME HUB — DESIGN TOKENS
     ============================================================ */
  :root{
    --void:        #05060c;
    --navy-1:      #0a0d1e;
    --navy-2:      #0d1226;
    --panel:       rgba(14, 18, 38, 0.55);
    --panel-solid: #0c0f22;
    --border-dim:  rgba(148, 156, 200, 0.14);
    --border-mid:  rgba(148, 156, 200, 0.26);

    --text-hi:     #f4f5fb;
    --text-mid:    #b7bcd6;
    --text-dim:    #767c9c;

    --blue-neb:    #3b5bff;
    --pink-neb:    #ff2e9a;

    --c-purple:    #a259ff;
    --c-purple-2:  #ff4ecd;
    --c-blue:      #2fb2ff;
    --c-blue-2:    #1c7bff;
    --c-pink:      #ff4ecd;
    --c-pink-2:    #b23bff;
    --c-cyan:      #2be8c9;
    --c-cyan-2:    #14b88a;
    --c-orange:    #ff7a18;
    --c-orange-2:  #ff3d00;

    --status-green: #34e39a;

    --font-display: 'Chakra Petch', 'Segoe UI', sans-serif;
    --font-body:    'Inter', 'Segoe UI', sans-serif;
    --font-mono:    'JetBrains Mono', 'SFMono-Regular', monospace;

    --radius-card: 4px;
  }

  /* ============================================================
     RESET
     ============================================================ */
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }
  body{
    background:var(--void);
    color:var(--text-hi);
    font-family:var(--font-body);
    overflow-x:hidden;
    min-height:100vh;
    line-height:1.5;
  }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--c-purple);
    outline-offset:3px;
    border-radius:2px;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ============================================================
     BACKGROUND — deep space / nebula / hud grid
     ============================================================ */
  .space-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 8%, rgba(20,24,48,0.55), transparent 60%),
      linear-gradient(180deg, var(--navy-1) 0%, var(--void) 55%, var(--navy-2) 100%);
    overflow:hidden;
  }
  .space-bg::before{
    /* faint grid */
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(148,156,200,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,156,200,0.045) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, #000 15%, transparent 75%);
            mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, #000 15%, transparent 75%);
  }
  .nebula{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.5;
    will-change:transform;
  }
  .nebula--blue{
    width:52vw; height:52vw; max-width:820px; max-height:820px;
    left:-16vw; top:-8vw;
    background:radial-gradient(circle at 40% 40%, var(--blue-neb), transparent 68%);
    animation:driftBlue 34s ease-in-out infinite;
  }
  .nebula--pink{
    width:48vw; height:48vw; max-width:760px; max-height:760px;
    right:-14vw; top:6vw;
    background:radial-gradient(circle at 60% 40%, var(--pink-neb), transparent 68%);
    opacity:0.4;
    animation:driftPink 40s ease-in-out infinite;
  }
  .nebula--core{
    width:60vw; height:30vw; max-width:900px; max-height:480px;
    left:50%; top:2vw; transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(90,60,160,0.25), transparent 70%);
    opacity:0.6;
  }
  @keyframes driftBlue{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(2vw, 3vw); }
  }
  @keyframes driftPink{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-2.4vw, -2vw); }
  }

  .stars{ position:absolute; inset:0; }
  .star{
    position:absolute;
    width:2px; height:2px;
    background:#fff;
    border-radius:50%;
    opacity:0.5;
    animation:twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.85; }
  }

  .circuit-lines{
    position:absolute; inset:0;
    opacity:0.16;
    pointer-events:none;
  }

  /* ============================================================
     LAYOUT SHELL
     ============================================================ */
  .page{ position:relative; z-index:1; }
  .wrap{
    width:100%;
    max-width:1360px;
    margin:0 auto;
    padding-inline:32px;
  }

  /* ============================================================
     HEADER
     ============================================================ */
  header.site-header{
    position:relative;
    z-index:10;
    padding-top:26px;
    padding-bottom:26px;
    border-bottom:1px solid var(--border-dim);
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:16px;
    min-width:0;
  }
  .brand-logo{
    height:90px;
    width:auto;
    flex-shrink:0;
    object-fit:contain;
  }
  .brand-copy{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .brand-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:0.14em;
    color:var(--text-hi);
    white-space:nowrap;
  }
  .brand-sub{
    font-family:var(--font-mono);
    font-weight:500;
    font-size:10.5px;
    letter-spacing:0.24em;
    color:var(--c-purple-2);
    white-space:nowrap;
  }

  .btn-join{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 22px;
    background:rgba(162,89,255,0.06);
    border:1px solid rgba(178,110,255,0.45);
    color:var(--text-hi);
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition:background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    white-space:nowrap;
    flex-shrink:0;
  }
  .btn-join svg{ flex-shrink:0; }
  .btn-join:hover,
  .btn-join:focus-visible{
    background:rgba(178,110,255,0.14);
    border-color:var(--c-pink);
    box-shadow:0 0 24px rgba(178,110,255,0.25);
    transform:translateY(-1px);
  }
  .btn-join .arrow{ transition:transform 0.25s ease; }
  .btn-join:hover .arrow{ transform:translateX(3px); }

  /* ============================================================
     HERO
     ============================================================ */
  .hero{
    position:relative;
    padding-top:96px;
    padding-bottom:120px;
    text-align:center;
    min-height:640px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hero-inner{
    position:relative;
    width:100%;
    max-width:840px;
    margin:0 auto;
    padding-inline:20px;
  }

  .hero-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.32em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .hero-eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--status-green);
    box-shadow:0 0 8px var(--status-green);
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  .hero h1{
    font-family:var(--font-display);
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(2.6rem, 7vw, 5.4rem);
    line-height:1.04;
    letter-spacing:0.02em;
    color:var(--text-hi);
  }
  .hero h1 .accent{
    background:linear-gradient(100deg, var(--c-purple) 0%, var(--c-pink) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero-subtitle{
    margin-top:26px;
    font-family:var(--font-mono);
    font-weight:500;
    font-size:clamp(11px, 1.4vw, 13px);
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--text-mid);
  }

  .hero-cta{
    margin-top:52px;
  }
  .btn-choose{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:17px 34px;
    background:rgba(10,12,26,0.6);
    border:1px solid rgba(178,110,255,0.5);
    color:var(--text-hi);
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    box-shadow:0 0 0 rgba(178,110,255,0);
    transition:box-shadow 0.3s ease, border-color 0.3s ease, transform 0.2s ease, background 0.3s ease;
  }
  .btn-choose:hover,
  .btn-choose:focus-visible{
    border-color:var(--c-pink);
    background:rgba(30,16,54,0.75);
    box-shadow:0 0 34px rgba(178,110,255,0.35);
    transform:translateY(-2px);
  }
  .btn-choose .chev{
    transition:transform 0.3s ease;
  }
  .btn-choose:hover .chev{ transform:translateY(3px); }

  /* HUD decorative panels */
  .hud{
    position:absolute;
    display:none;
    font-family:var(--font-mono);
    color:var(--text-dim);
    pointer-events:none;
    user-select:none;
  }
  @media (min-width: 900px){
    .hud{ display:block; }
  }
  .hud--left{
    left:0;
    top:52%;
    transform:translateY(-50%);
  }
  .hud-panel{
    border:1px solid var(--border-dim);
    background:rgba(10,12,26,0.35);
    padding:14px 18px;
    clip-path:polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
  }
  .hud-panel .l1{
    font-size:11px; letter-spacing:0.22em; color:var(--text-mid); font-weight:600;
  }
  .hud-panel .l2{
    font-size:11px; letter-spacing:0.22em; color:var(--c-purple-2); font-weight:600; margin-top:2px;
  }
  .hud-bars{
    display:flex; gap:3px; margin-top:10px;
  }
  .hud-bars span{
    width:14px; height:3px; background:var(--border-mid);
  }
  .hud-bars span:nth-child(1){ background:var(--c-purple); }
  .hud-bars span:nth-child(2){ background:var(--c-purple); opacity:0.7; }

  .hud--right{
    right:0;
    top:38%;
    text-align:right;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:22px;
  }
  .hud-status{
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--text-mid);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .hud-status .led{
    width:6px; height:6px; border-radius:50%;
    background:var(--status-green);
    box-shadow:0 0 8px var(--status-green);
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  .hud-radar{
    width:96px; height:96px;
    border-radius:50%;
    border:1px solid var(--border-mid);
    position:relative;
    opacity:0.7;
  }
  .hud-radar::before{
    content:"";
    position:absolute; inset:16px;
    border-radius:50%;
    border:1px solid var(--border-dim);
  }
  .hud-radar::after{
    content:"";
    position:absolute; left:50%; top:50%;
    width:50%; height:1px;
    background:linear-gradient(90deg, var(--c-cyan), transparent);
    transform-origin:left center;
    animation:radarSweep 4.5s linear infinite;
  }
  @keyframes radarSweep{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  /* ============================================================
     INTERACTIVE 3D GAME CORE + PARTICLE UNIVERSE
     ============================================================ */
  .particle-field{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    opacity:.72;
  }
  .hero-core{
    position:absolute;
    left:50%;
    top:50%;
    width:320px;
    height:320px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:0;
    opacity:.72;
    transition:transform .18s ease-out;
    will-change:transform;
  }
  .hero-core::before{
    content:"";
    position:absolute;
    inset:52px;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 30%, rgba(255,255,255,.48), transparent 8%),
      radial-gradient(circle at 40% 35%, rgba(162,89,255,.95), rgba(85,42,190,.72) 38%, rgba(18,12,52,.2) 68%, transparent 72%);
    box-shadow:
      0 0 35px rgba(162,89,255,.34),
      0 0 90px rgba(255,78,205,.14),
      inset -20px -24px 50px rgba(0,0,0,.5);
    filter:saturate(1.15);
  }
  .hero-core::after{
    content:"";
    position:absolute;
    inset:70px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 0 25px rgba(43,232,201,.12);
  }
  .core-ring{
    position:absolute;
    left:50%; top:50%;
    width:280px; height:110px;
    transform:translate(-50%,-50%) rotate(-18deg);
    border:1px solid rgba(43,232,201,.38);
    border-radius:50%;
    box-shadow:0 0 18px rgba(43,232,201,.12);
    animation:coreOrbit 9s linear infinite;
  }
  .core-ring.ring-2{
    width:230px; height:90px;
    transform:translate(-50%,-50%) rotate(58deg);
    border-color:rgba(255,78,205,.34);
    animation-duration:12s;
    animation-direction:reverse;
  }
  .core-ring.ring-3{
    width:185px; height:185px;
    transform:translate(-50%,-50%) rotate(25deg);
    border-color:rgba(162,89,255,.28);
    animation-duration:15s;
  }
  .core-ring::after{
    content:"";
    position:absolute;
    width:5px; height:5px;
    border-radius:50%;
    background:currentColor;
    color:var(--c-cyan);
    top:50%; right:-3px;
    box-shadow:0 0 10px currentColor;
  }
  .ring-2::after{ color:var(--c-pink); left:-3px; right:auto; }
  .ring-3::after{ color:var(--c-purple); top:-3px; right:30%; }
  .core-crosshair{
    position:absolute;
    inset:50%;
    width:1px; height:220px;
    background:linear-gradient(transparent,rgba(255,255,255,.12),transparent);
    transform:translate(-50%,-50%);
  }
  .core-crosshair.x{
    width:220px; height:1px;
  }
  @keyframes coreOrbit{ to{ transform:translate(-50%,-50%) rotate(342deg); } }

  .hero-inner{ z-index:2; }
  .hero .hud{ z-index:3; }

  @media (min-width:900px){
    .hero-core{ display:block; }
  }
  @media (max-width:899px){
    .hero-core{ width:240px; height:240px; opacity:.34; }
    .core-ring{ width:210px; height:82px; }
    .core-ring.ring-2{ width:175px; height:68px; }
    .core-ring.ring-3{ width:145px; height:145px; }
    .hero-core::before{ inset:42px; }
    .hero-core::after{ inset:56px; }
  }
  @media (prefers-reduced-motion: reduce){
    .core-ring{ animation:none; }
  }

  /* ============================================================
     GAMES SECTION
     ============================================================ */
  .games{
    position:relative;
    padding-bottom:140px;
    padding-top:10px;
  }
  .section-label{
    text-align:center;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:46px;
  }

  .game-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:18px;
  }
  @media (max-width:1280px){
    .game-grid{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (max-width:840px){
    .game-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:560px){
    .game-grid{ grid-template-columns:1fr; }
  }

  .game-card{
    position:relative;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--border-dim);
    padding:26px 20px 22px;
    text-align:left;
    color:var(--text-hi);
    width:100%;
    min-height:340px;
    isolation:isolate;
    overflow:hidden;
    clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    transition:transform 0.28s ease, border-color 0.28s ease, background 0.28s ease;
  }
  .game-card::before{
    /* accent glow behind card */
    content:"";
    position:absolute;
    inset:-30%;
    z-index:-1;
    opacity:0;
    background:radial-gradient(circle at 30% 20%, var(--glow-color, transparent), transparent 60%);
    transition:opacity 0.3s ease;
  }
  .game-card:hover,
  .game-card:focus-visible{
    transform:translateY(-6px);
    border-color:var(--card-accent);
    background:rgba(16,20,42,0.7);
  }
  .game-card:hover::before,
  .game-card:focus-visible::before{ opacity:0.55; }

  .game-card--gridlock{ --card-accent:var(--c-purple); --glow-color:rgba(162,89,255,0.35); }
  .game-card--codebreaker{ --card-accent:var(--c-blue); --glow-color:rgba(47,178,255,0.32); }
  .game-card--shapeshift{ --card-accent:var(--c-pink); --glow-color:rgba(255,78,205,0.32); }
  .game-card--pinpoint{ --card-accent:var(--c-cyan); --glow-color:rgba(43,232,201,0.32); }
  .game-card--roadrash{ --card-accent:var(--c-orange); --glow-color:rgba(255,122,24,0.35); }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .card-index{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--text-dim);
  }
  .card-status{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--card-accent);
    border:1px solid currentColor;
    padding:3px 8px;
    opacity:0.85;
  }

  .card-icon{
    width:52px; height:52px;
    display:flex; align-items:center; justify-content:center;
    color:var(--card-accent);
    margin-bottom:18px;
    transition:filter 0.3s ease;
  }
  .game-card:hover .card-icon{
    filter:drop-shadow(0 0 10px var(--card-accent));
  }
  .card-icon svg{ width:100%; height:100%; }

  .card-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .card-subtitle{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--card-accent);
    margin-bottom:14px;
  }
  .card-category{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .card-desc{
    font-size:13.5px;
    line-height:1.55;
    color:var(--text-mid);
    flex-grow:1;
  }

  .game-card:disabled{ cursor:not-allowed; opacity:.62; }
  .game-card:disabled:hover{ transform:none; border-color:var(--border-dim); background:var(--panel); }
  .game-card:disabled::before{ opacity:0 !important; }
  .game-card:disabled .card-icon{ filter:none; }
  .game-card:disabled .card-play{ color:var(--text-dim); }

  .card-play{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--border-dim);
    background:none;
    border-left:none;
    border-right:none;
    border-bottom:none;
    color:var(--text-hi);
    font-family:var(--font-display);
    font-weight:600;
    font-size:12px;
    letter-spacing:0.14em;

/* ============================================================
   CONFIG — centralized redirect targets.
   Update the URLs below when each game / the club page is deployed.
   ============================================================ */
const CONFIG = {
  clubUrl: "https://microsoft-campus-club-webpage.vercel.app/",

  games: {
    gridlock:    "#", // TODO: replace with THE GRIDLOCK deployed URL
    codebreaker: "https://microsoft-campus-club-code-breaker.vercel.app/",
    shapeshift:  "https://comfy-rugelach-f3ced1.netlify.app/", 
    pinpoint:    "https://idyllic-malasada-b7f5a3.netlify.app", 
    roadrash:    "https://bespoke-beignet-0d3e50.netlify.app/"
  }
};

/* Join the Club button */
document.getElementById('joinClubBtn').addEventListener('click', function(e){
  e.preventDefault();
  window.location.href = CONFIG.clubUrl;
});

/* Game cards */
document.querySelectorAll('.game-card').forEach(function(card){
  card.addEventListener('click', function(){
    if(card.disabled) return;
    const key = card.getAttribute('data-game');
    const url = CONFIG.games[key];
    if(url && url !== "#"){
      window.location.href = url;
    }
  });
});

/* Interactive particle universe + cursor-responsive 3D core */
(function(){
  const canvas = document.getElementById('particleField');
  const core = document.getElementById('heroCore');
  const hero = document.querySelector('.hero');
  if(!canvas || !hero) return;
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let particles = [];
  let w = 0, h = 0;
  let pointer = {x:0, y:0, active:false};

  function resize(){
    const rect = hero.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    w = rect.width; h = rect.height;
    canvas.width = Math.floor(w*dpr);
    canvas.height = Math.floor(h*dpr);
    canvas.style.width = w+'px';
    canvas.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = w < 640 ? 38 : 72;
    particles = Array.from({length:count}, () => ({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-.5)*.12, vy:(Math.random()-.5)*.12,
      r:Math.random()*1.4+.35,
      a:Math.random()*.45+.15
    }));
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    const px = pointer.active ? pointer.x : w*.5;
    const py = pointer.active ? pointer.y : h*.45;
    for(const p of particles){
      if(!reduce){
        p.x += p.vx; p.y += p.vy;
        if(p.x < -10) p.x=w+10; if(p.x>w+10) p.x=-10;
        if(p.y < -10) p.y=h+10; if(p.y>h+10) p.y=-10;
      }
      const dx=px-p.x, dy=py-p.y, dist=Math.hypot(dx,dy);
      if(pointer.active && dist < 150 && !reduce){
        const force=(1-dist/150)*.018;
        p.x -= dx*force; p.y -= dy*force;
      }
      ctx.beginPath();
      ctx.fillStyle='rgba(190,198,255,'+p.a+')';
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    if(!reduce) requestAnimationFrame(draw);
  }

  hero.addEventListener('pointermove', e=>{
    const r=hero.getBoundingClientRect();
    pointer.x=e.clientX-r.left; pointer.y=e.clientY-r.top; pointer.active=true;
    if(core){
      const rx=(pointer.x/r.width-.5)*14;
      const ry=(pointer.y/r.height-.5)*10;
      core.style.transform='translate(calc(-50% + '+rx+'px), calc(-50% + '+ry+'px)) rotateX('+(-ry*.35)+'deg) rotateY('+(rx*.35)+'deg)';
    }
  });
  hero.addEventListener('pointerleave',()=>{
    pointer.active=false;
    if(core) core.style.transform='translate(-50%,-50%)';
  });
  window.addEventListener('resize',resize,{passive:true});
  resize(); draw();
})();

/* Lightweight starfield — generated once, no per-frame JS cost */
(function(){
  const container = document.getElementById('stars');
  if(!container) return;
  const COUNT = window.innerWidth < 640 ? 65 : 150;
  const frag = document.createDocumentFragment();
  for(let i = 0; i < COUNT; i++){
    const s = document.createElement('div');
    s.className = 'star' + (Math.random() < 0.14 ? ' star-bright' : '');
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 5) + 's';
    s.style.animationDuration = (3 + Math.random() * 4) + 's';
    frag.appendChild(s);
  }
  container.appendChild(frag);
})();
</script>

  const palette = [

  ];

  function createNodes() {

    nodes = Array.from({ length: count }, (_, i) => ({

      phase: Math.random() * Math.PI * 2,
      color: palette[i % palette.length]
    }));
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createNodes();
  }

  function render(time) {
    const dt = Math.min(32, time - lastTime || 16);
    lastTime = time;

    ctx.clearRect(0, 0, width, height);

    const maxLink = width < 720 ? 110 : 155;
    const mouseRadius = width < 720 ? 125 : 190;

    if (!reduceMotion.matches) {
      for (const n of nodes) {
        n.x += n.vx * dt;
        n.y += n.vy * dt;

        if (n.x < -20) n.x = width + 20;
        if (n.x > width + 20) n.x = -20;
        if (n.y < -20) n.y = height + 20;
        if (n.y > height + 20) n.y = -20;

        if (pointer.active && !touchDevice.matches) {
          const dx = n.x - pointer.x;
          const dy = n.y - pointer.y;
          const distance = Math.hypot(dx, dy);

          if (distance < mouseRadius && distance > 1) {
            const force = (1 - distance / mouseRadius) * 0.045;
            n.x += (dx / distance) * force * dt;
            n.y += (dy / distance) * force * dt;
          }
        }
      }
    }

    // Connections
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const distance = Math.hypot(dx, dy);

        if (distance > maxLink) continue;

        let alpha = (1 - distance / maxLink) * 0.34;

        if (pointer.active && !touchDevice.matches) {
          const da = Math.hypot(a.x - pointer.x, a.y - pointer.y);
          const db = Math.hypot(b.x - pointer.x, b.y - pointer.y);
          if (da < mouseRadius || db < mouseRadius) alpha += 0.20;
        }

        const [r, g, bcol] = a.color;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(${r},${g},${bcol},${Math.min(alpha, 0.58)})`;
        ctx.lineWidth = 0.75;
        ctx.stroke();
      }
    }

    // Nodes
    for (const n of nodes) {
      const pulse = (Math.sin(time * 0.0015 + n.phase) + 1) / 2;
      const radius = n.size + pulse * 0.8;
      const [r, g, b] = n.color;

      ctx.beginPath();
      ctx.fillStyle = `rgba(${r},${g},${b},${0.72 + pulse * 0.22})`;
      ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = `rgba(${r},${g},${b},0.09)`;
      ctx.arc(n.x, n.y, radius * 5, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion.matches) {
      raf = requestAnimationFrame(render);
    }
  }

  function start() {
    cancelAnimationFrame(raf);
    lastTime = performance.now();
    raf = requestAnimationFrame(render);
  }

  window.addEventListener("resize", resize, { passive: true });

  window.addEventListener("pointermove", (event) => {
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    pointer.active = true;
  }, { passive: true });

  window.addEventListener("pointerleave", () => {
    pointer.active = false;
  }, { passive: true });

  resize();
  start();

  if (reduceMotion.addEventListener) {
    reduceMotion.addEventListener("change", start);
  }
})();
</script>

</body>
</html>
